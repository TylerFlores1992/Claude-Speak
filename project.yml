# XcodeGen fallback.
#
# The committed PocketClaude.xcodeproj is hand-written and should just open.
# If Xcode ever refuses it (or you want to regenerate from scratch), install
# XcodeGen and run `xcodegen generate` in this directory:
#
#     brew install xcodegen && xcodegen generate
#
# That rewrites PocketClaude.xcodeproj from this file.

name: PocketClaude
options:
  bundleIdPrefix: com.tylerflores
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PocketClaude:
    type: application
    platform: iOS
    sources:
      - path: PocketClaude
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerflores.pocketclaude
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic

  PocketClaudeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketClaudeTests
    dependencies:
      - target: PocketClaude
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerflores.pocketclaude.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PocketClaude:
    build:
      targets:
        PocketClaude: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PocketClaudeTests

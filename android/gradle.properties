org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# So a task in one module does not configure the others. Without this, running
# :core:test configures :app and :wear too, which needs the Android Gradle
# Plugin, which cannot be downloaded here. See build.gradle.kts.
org.gradle.configureondemand=true

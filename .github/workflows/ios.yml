name: iOS

# Two jobs:
#
#   build  — compiles and runs the tests on every push. No signing, no secrets,
#            no Apple account. This is the one that tells you the code is sound.
#   ship   — archives, signs, and uploads to TestFlight. Manual only, so it
#            never fires by accident and never burns minutes you didn't intend.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Newest Xcode on the image, whatever its version. Pinning a major version
      # is what produced an iOS 18.5 SDK build that App Store Connect rejected;
      # Apple requires the current SDK, so "newest" is the only stable rule.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      # Simulator names change with every Xcode release, so resolve one by UDID
      # instead of hardcoding "iPhone 16" and having it vanish next year.
      - name: Pick a simulator
        run: |
          xcrun simctl list devices available
          xcrun simctl list devices available -j > /tmp/sims.json
          python3 - > /tmp/sim.env <<'PY'
          import json, sys

          data = json.load(open("/tmp/sims.json"))
          candidates = [
              (runtime, device)
              for runtime, devices in data["devices"].items() if "iOS" in runtime
              for device in devices if device["name"].startswith("iPhone")
          ]
          if not candidates:
              sys.exit("::error::No iPhone simulator available on this runner")

          runtime, device = candidates[-1]
          print(f"SIM_UDID={device['udid']}")
          print(f"SIM_LABEL={device['name']} on {runtime.split('.')[-1]}")
          PY
          cat /tmp/sim.env >> "$GITHUB_ENV"
          sed 's/^/Selected /' /tmp/sim.env

      # No log prettifier — a raw xcodebuild log is ugly but it's the one thing
      # that always works, and compiler errors are what we're here to read.
      - name: Build and test
        run: |
          xcodebuild test \
            -project PocketClaude.xcodeproj \
            -scheme PocketClaude \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  ship:
    name: Archive and upload to TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight
    runs-on: macos-26
    timeout-minutes: 45

    env:
      SCHEME: PocketClaude
      PROJECT: PocketClaude.xcodeproj
      BUNDLE_ID: com.tylerflores.pocketclaude

    steps:
      - uses: actions/checkout@v4

      # App Store Connect rejects anything built with an older SDK, and it does
      # so at the very end of a five-minute job. Check the SDK up front so a
      # stale runner image fails in seconds with a message that says why.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)
          echo "Newest iOS SDK on this runner: $SDK"
          if [ -z "$SDK" ] || [ "$SDK" -lt 26 ]; then
            echo "::error::Runner has iOS SDK ${SDK:-none}; App Store Connect requires 26 or later."
            exit 1
          fi

      # Fail with a readable message rather than a cryptic one 30 seconds later.
      - name: Check secrets are present
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in KEY_ID ISSUER_ID PRIVATE_KEY TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is empty or missing"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Key ID length: ${#KEY_ID}   (expected 10)"
          echo "Issuer ID length: ${#ISSUER_ID}   (expected 36)"
          echo "Team ID length: ${#TEAM_ID}   (expected 10)"

      # The App Store Connect API key replaces an Apple ID + 2FA, which is the
      # only practical way to authenticate from an unattended machine.
      #
      # The .p8 is rebuilt from scratch rather than echoed straight out of the
      # secret. Pasting a PEM into a web form flattens the line breaks often
      # enough that "invalidPEMDocument" is the single most common failure here;
      # re-wrapping the base64 body at 64 columns makes the step work whether the
      # secret arrived multi-line, single-line, or with escaped \n sequences.
      - name: Write App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          python3 - <<'PY'
          import base64, os, pathlib, re, sys

          raw = os.environ["PRIVATE_KEY"]
          raw = raw.replace("\\n", "\n")            # escaped newlines, if any
          body = re.sub(r"-----[^-]+-----", "", raw)  # drop BEGIN/END if present
          body = re.sub(r"\s+", "", body)             # collapse to pure base64

          if not body:
              sys.exit("::error::APP_STORE_CONNECT_PRIVATE_KEY has no key material")
          try:
              base64.b64decode(body, validate=True)
          except Exception:
              sys.exit("::error::APP_STORE_CONNECT_PRIVATE_KEY is not valid base64 — "
                       "re-copy the whole .p8 file, including the BEGIN/END lines")

          pem = "-----BEGIN PRIVATE KEY-----\n"
          pem += "\n".join(body[i:i + 64] for i in range(0, len(body), 64))
          pem += "\n-----END PRIVATE KEY-----\n"

          path = pathlib.Path.home() / "private_keys" / f"AuthKey_{os.environ['KEY_ID']}.p8"
          path.write_text(pem)
          # altool looks in this exact directory.
          (pathlib.Path.home() / ".appstoreconnect" / "private_keys" / path.name).write_text(pem)
          # Shape only — never the contents.
          print(f"Wrote {path.name}: {len(pem.splitlines())} lines, {len(body)} base64 chars")
          PY

          # Parse the key before handing it to xcodebuild. If this fails, the
          # secret is wrong; if it passes and xcodebuild still complains, the
          # problem is the credential (key ID / issuer / role), not the file.
          openssl pkey -in ~/private_keys/AuthKey_${KEY_ID}.p8 -noout \
            || { echo "::error::The .p8 is not a readable private key — re-create the App Store Connect API key"; exit 1; }
          echo "Private key parses cleanly."

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # CODE_SIGN_IDENTITY is what automatic signing reads to decide which
          # kind of profile to mint. The iOS default is "Apple Development",
          # which needs at least one registered device — and a CI runner has
          # none. An App Store upload wants a distribution profile anyway, and
          # those need no devices, so ask for one explicitly.
          #
          # github.run_number gives a build number that always increases, which
          # is the rule App Store Connect enforces most often.
          archive() {
            xcodebuild archive \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination 'generic/platform=iOS' \
              -archivePath build/PocketClaude.xcarchive \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CURRENT_PROJECT_VERSION=${{ github.run_number }} \
              "$@"
          }

          # Fallback: archive without signing at all and let -exportArchive do
          # it. Export knows it is producing an App Store build, so it resolves
          # the distribution profile without any of the guesswork above. Costs a
          # second archive, which is why it is the fallback and not the default.
          if ! archive CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution"; then
            echo "::warning::Signed archive failed; retrying unsigned and signing at export."
            rm -rf build/PocketClaude.xcarchive
            archive CODE_SIGNING_ALLOWED=NO
          fi

          # Which profile actually got embedded — the first thing worth knowing
          # if the export step later disagrees about the signing type. Absent on
          # the unsigned fallback path, which is expected.
          PROFILE="build/PocketClaude.xcarchive/Products/Applications/PocketClaude.app/embedded.mobileprovision"
          if [ -f "$PROFILE" ]; then
            # `|| true` because pipefail is on and this is only diagnostics —
            # a missing key here must not fail an otherwise good archive.
            security cms -D -i "$PROFILE" \
              | plutil -extract Name raw - 2>/dev/null \
              | sed 's/^/Embedded profile: /' || true
          fi

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/PocketClaude.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA="$(find build/export -name '*.ipa' | head -1)"
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketClaude-ipa
          path: build/export/*.ipa
          retention-days: 14
          if-no-files-found: ignore

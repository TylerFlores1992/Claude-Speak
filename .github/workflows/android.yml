name: Android

# The Android client, phone and watch. A separate workflow from ios.yml rather
# than a job inside it, for two reasons:
#
#   Cost. This runs on ubuntu-latest. The iOS build needs macOS, which bills at
#   a 10x multiplier and once exhausted a month of Actions minutes in a day.
#   Keeping them apart means Android work never drags the expensive runner in.
#
#   Blast radius. The iOS lane ships to TestFlight and is not to be disturbed by
#   work on this one.
#
# No `paths` filter, matching ios.yml and for the same reason: a filter that can
# silently skip a run is worse than a build that costs a few free minutes. A
# push that lands with no run at all sits unvalidated until someone notices.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deliberately NOT the same concurrency group as ios.yml. On a push to main both
# would otherwise be `ios-refs/heads/main`, and `cancel-in-progress` would let an
# Android run kill an in-flight TestFlight upload -- which is exactly how one was
# lost, six seconds before it finished.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build phone and watch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # `test` prints nothing on success, so a green run cannot be told from a
      # run that executed no tests at all. That is the same failure this repo
      # refuses a paths filter over. The report is uploaded so the count is
      # visible rather than inferred, and the summary line below puts it in the
      # log without having to download anything.
      # testDebugUnitTest, not `test`. `test` runs the debug and release
      # variants both, so every test executes twice and the count below reads
      # as double the coverage there actually is. There are no variant-specific
      # source sets here, so the second run asserts nothing the first did not.
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :wear:testDebugUnitTest

      - name: Say how many tests ran
        if: always()
        working-directory: android
        run: |
          total=0
          for f in $(find . -path '*/test-results/*' -name 'TEST-*.xml'); do
            n=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            total=$((total + ${n:-0}))
          done
          echo "unit tests executed: $total"
          echo "Unit tests executed: **$total**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -eq 0 ]; then
            echo "No tests ran. A green build that ran nothing is not a pass."
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/**/build/reports/tests/**
          if-no-files-found: warn

      - name: Assemble phone
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Assemble watch
        working-directory: android
        run: ./gradlew --no-daemon :wear:assembleDebug

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/wear/build/outputs/apk/**/*.apk
          if-no-files-found: warn
